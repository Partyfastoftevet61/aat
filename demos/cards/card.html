<!doctype html>
<!--
  The launch cards: the announcement card and one per project repository.
  Rendered by demos/cards.mjs, which sets window.__card before the page loads
  and screenshots the viewport. One 1200x630 design is scaled to fit whatever
  viewport the card asks for, so every size lays out identically.

  Colours are the web UI's (server/web/src/app.css), matching social-preview.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>aat card</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0f1117;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  /* The design box. Scaled by fit() to sit inside the viewport with a margin. */
  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 58px 66px 50px;
    display: flex;
    flex-direction: column;
    transform-origin: center center;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 22px;
  }
  .wordmark {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #818cf8;
    font-size: 96px;
  }
  .card.project .wordmark { font-size: 68px; }
  .kicker {
    font-size: 30px;
    font-weight: 600;
    color: #9ca3af;
  }
  .badge {
    margin-left: auto;
    align-self: center;
    padding: 9px 20px;
    border: 1px solid #3730a3;
    border-radius: 999px;
    background: #1a1d27;
    color: #a5b4fc;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .tagline {
    margin-top: 32px;
    max-width: 1010px;
    font-size: 33px;
    line-height: 1.32;
    font-weight: 500;
  }
  .card.project .tagline { font-size: 31px; max-width: 1040px; }
  .tagline strong { color: #c7d2fe; font-weight: 600; }
  .terminal {
    margin-top: auto;
    padding: 20px 26px;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    background: #1a1d27;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 19px;
    line-height: 1.6;
    white-space: pre;
    color: #e4e4e7;
  }
  .muted { color: #9ca3af; }
  .passed { color: #22c55e; font-weight: 700; }
  .url {
    margin-top: 22px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 21px;
    color: #9ca3af;
  }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  // window.__card: {variant, wordmark, kicker, badge, tagline, terminal, url}
  // terminal is a list of lines; each line is a list of {t, c} spans.
  const data = window.__card || {};
  const card = document.getElementById('card');
  if (data.variant) card.classList.add(data.variant);

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const brand = el('div', 'brand');
  brand.append(el('div', 'wordmark', data.wordmark));
  if (data.kicker) brand.append(el('div', 'kicker', data.kicker));
  if (data.badge) brand.append(el('div', 'badge', data.badge));
  card.append(brand);

  const tagline = el('div', 'tagline');
  //   in the data keeps a phrase from breaking across lines.
  tagline.textContent = data.tagline || '';
  card.append(tagline);

  if (data.terminal) {
    const term = el('div', 'terminal');
    data.terminal.forEach((line, i) => {
      if (i) term.append(document.createTextNode('\n'));
      line.forEach((span) => term.append(el('span', span.c || null, span.t)));
    });
    card.append(term);
  }

  if (data.url) card.append(el('div', 'url', data.url));

  // Scale the 1200x630 design to fit the viewport, leaving a small margin so
  // nothing sits against a platform's rounded crop.
  function fit() {
    const scale = Math.min(window.innerWidth / 1240, window.innerHeight / 660);
    card.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fit();
  window.addEventListener('resize', fit);
</script>
</body>
</html>
