adapter: airline.commitBooking
protocol: http

# Note: offerStatus and travelerId are ordering inputs from graph edges.
# They ensure addOffer and addTraveler complete before commit but are
# not used in the request body — the itinerary already holds that state.

request:
  method: POST
  path: /v1/air/book/reservation/reservations/{{itineraryId}}
  headers:
    Content-Type: application/json
  body: |
    {
      "@type": "ReservationQueryConfirmItinerary"
    }

response:
  extract:
    locator: "$.ReservationResponse.Reservation.Receipt.0.Confirmation.Locator.value"
    locatorSource: "$.ReservationResponse.Reservation.Receipt.0.Confirmation.Locator.source"
