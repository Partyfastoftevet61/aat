adapter: airline.addOffer
protocol: http

# Uses FromFlightOffers on the itinerary to add an offer
# by referencing the catalog offering identifiers from the Search response.

request:
  method: POST
  path: /v1/air/book/airoffer/reservationitinerary/{{itineraryId}}/offers/fromflightoffers
  headers:
    Content-Type: application/json
  body: |
    {
      "@type": "OfferQueryFromFlightOffers",
      "FromFlightOffersRequest": {
        "@type": "FromFlightOffersRequest",
        "FlightOffersIdentifier": {
          "Identifier": {
            "value": "{{catalogOfferingsId}}"
          }
        },
        "FlightOfferSelection": [
          {
            "FlightOfferIdentifier": {
              "Identifier": {
                "value": "{{offeringId}}"
              }
            },
            "ProductIdentifier": [
              {
                "Identifier": {
                  "value": "{{productRef}}"
                }
              }
            ]
          }
        ]
      }
    }

response:
  extract:
    offerStatus: "$.OfferListResponse.OfferID.0.Identifier.value"
