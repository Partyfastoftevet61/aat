adapter: airline.addTraveler
protocol: http

request:
  method: POST
  path: /v1/air/book/traveler/reservationitinerary/{{itineraryId}}/travelers
  headers:
    Content-Type: application/json
  body: |
    {
      "@type": "Traveler",
      "gender": "{{gender}}",
      "birthDate": "{{birthDate}}",
      "passengerTypeCode": "{{passengerTypeCode}}",
      "PersonName": {
        "@type": "PersonNameDetail",
        "Given": "{{givenName}}",
        "Surname": "{{surname}}"
      },
      "Telephone": [
        {
          "@type": "Telephone",
          "countryAccessCode": "1",
          "phoneNumber": "2125551234",
          "role": "Home"
        }
      ],
      "Email": [
        {
          "value": "test@example.com"
        }
      ]
    }

response:
  extract:
    travelerId: "$.TravelerResponse.Traveler.Identifier.value"
