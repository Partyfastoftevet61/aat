version: "1.0.0"

workflows:
  - name: Main Booking
    template: plans/booking.yaml

  - name: Seat Selection
    kind: addon
    template: plans/seat-selection.yaml
    after: book
    wire:
      itineraryId: book.itineraryId

nodes:
  search:
    description: "Search flights"
    adapter: search
    inputs:
      - name: origin
        type: string
    outputs:
      - name: results
        type: string[]

  book:
    description: "Book a flight"
    adapter: book
    inputs:
      - name: flightId
        type: string
    outputs:
      - name: itineraryId
        type: string

  searchSeatMap:
    description: "Search for available seats"
    adapter: searchSeatMap
    inputs:
      - name: itineraryId
        type: string
    outputs:
      - name: seats
        type: string[]

  addSeat:
    description: "Add seat selection"
    adapter: addSeat
    inputs:
      - name: itineraryId
        type: string
      - name: seatId
        type: string
    outputs:
      - name: confirmationId
        type: string

  commit:
    description: "Commit the booking"
    adapter: commit
    inputs:
      - name: itineraryId
        type: string
    outputs:
      - name: locator
        type: string

edges:
  - from: search.results
    to: book.flightId
    select: true
  - from: book.itineraryId
    to: commit.itineraryId
