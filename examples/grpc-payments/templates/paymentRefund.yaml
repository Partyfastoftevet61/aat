adapter: paymentRefund
protocol: grpc

request:
  rpc: shop.v1.Payments/Refund
  # Omitting amount refunds whatever is left on the order.
  message: |
    {
      "orderId": "{{orderId}}"
    }

response:
  extract:
    refundId: refundId
    paymentId: paymentId
    refundStatus: status
    refundedAmount: amount
