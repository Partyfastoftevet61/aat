# The shop API is HTTP; payments is gRPC. One environment, two protocols: the
# default route is the shop, and an override sends every payment* node to the
# gRPC target instead. Per-node routing is what makes a mixed project work, and
# it predates gRPC — the shop example uses the same mechanism to reach its
# HTTP payments listener on another port.
environment: local

apiBaseUrl: http://localhost:8765/us/v1

auth:
  type: oauth2
  tokenUrl: http://localhost:8765/oauth/token
  credentials:
    username: {source: literal, value: demo}
    password: {source: literal, value: demo}
    clientId: {source: literal, value: aat-shop}
    clientSecret: {source: literal, value: aat-shop-secret}

overrides:
  # grpc:// is plaintext, grpcs:// is TLS. The sandbox serves plaintext.
  - match: "payment*"
    baseUrl: grpc://localhost:8767
    # The shop bearer token is not sent to payments; it takes an API key, which
    # travels as metadata on a gRPC call exactly as it travels as a header on
    # an HTTP one.
    auth:
      type: apikey
      headerName: x-api-key
      credentials:
        key: {source: literal, value: pay-demo-key}
