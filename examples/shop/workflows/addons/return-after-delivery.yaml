execution:
  steps:
    - node: deliverShipment
      description: Mark the shipment delivered
      values:
        shipmentId: AUTOWIRE

    - node: createReturn
      dependsOn: [deliverShipment]
      description: Return the delivered order

    - node: paymentRefund
      dependsOn: [createReturn]
      description: Refund the whole payment

  # Replaces the base workflow's getOrder verification: after this addon the
  # order ends returned, not shipped.
  verification:
    - node: getOrder
      purpose: The order ends returned with its payment fully refunded
      assertions:
        mechanical:
          - type: predicate
            expr: 'status == "returned" && paymentStatus == "refunded"'
