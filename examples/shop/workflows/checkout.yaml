intent:
  goal: shipOrder
  description: Check out a cart as a chosen kind of customer, pay by a chosen method, and ship

execution:
  steps:
    - node: listProducts
      description: Browse the catalog

    - slot: customer
      dependsOn: [listProducts]

    - node: addItem
      dependsOn: [customer]
      description: Add the first in-stock product

    - node: getCart
      dependsOn: [addItem]
      description: Read the cart back with names and prices joined in

    - id: checkout
      node: checkoutCart
      dependsOn: [getCart]
      description: Price the cart and create the order

    - slot: payment
      dependsOn: [checkout]

    - node: shipOrder
      dependsOn: [payment]
      isGoal: true
      description: Ship the paid order

  # An addon that verifies getOrder (Return After Delivery) replaces this check.
  verification:
    - node: getOrder
      purpose: The paid order shipped
      assertions:
        mechanical:
          - type: predicate
            expr: 'status == "shipped"'
