concepts:
  authentication:
    description: >-
      The shop API (http://localhost:8765/{region}/v1) needs "Authorization: Bearer <token>" on every
      call. Get the token from POST http://localhost:8765/oauth/token with a form-encoded body:
      grant_type=password, username=demo, password=demo, client_id=aat-shop,
      client_secret=aat-shop-secret. grant_type=client_credentials with the client ID and secret
      also works, and the client credentials may be sent as HTTP Basic auth instead. The response is
      JSON with access_token, token_type Bearer, and expires_in 3600 (seconds). A missing or expired
      token answers 401 UNAUTHORIZED. The payments API takes an API key instead; see paymentsHost.
    applies_to: [cartId, orderId, shipmentId, sku]
    constraint: send the bearer token to the shop API only, never to the payments API

  paymentsHost:
    description: >-
      paymentCharge and paymentRefund run on a separate payments API at
      http://localhost:8766/{region}/v1 (POST /payments/charges and POST /payments/refunds). It
      requires the header X-API-Key with the value pay-demo-key and takes no bearer token. The shop
      API answers /{region}/v1/payments/ paths with 404 WRONG_LISTENER. Use the same region on both
      hosts.
    applies_to: [amount, currency, method, cardNumber, giftCardCode, paypalEmail, paymentId, refundId]
    constraint: payments go to port 8766 with X-API-Key; every other operation goes to port 8765 with the bearer token

  errorEnvelope:
    description: >-
      Errors from both APIs under /{region}/v1 share one JSON envelope, {"error": {"code": "...",
      "message": "..."}}. Branch on the stable code, not the message. A path outside that prefix (a
      wrong base URL or API version) gets a plain-text 404 or 405 instead, and an unknown region is
      404 REGION_NOT_FOUND before any credential check. 400 VALIDATION_ERROR (including a missing or
      malformed JSON body); 401 UNAUTHORIZED; 402 CARD_DECLINED or INSUFFICIENT_FUNDS; 404 NOT_FOUND,
      REGION_NOT_FOUND, COUPON_INVALID, GIFT_CARD_INVALID, or WRONG_LISTENER; 409 CART_NOT_OPEN,
      CART_EMPTY, OUT_OF_STOCK, INVALID_TRANSITION, or PAYMENT_NOT_REFUNDABLE; 422
      TIER_NOT_AVAILABLE, COUPON_NOT_VALID_IN_REGION, CURRENCY_MISMATCH, or AMOUNT_MISMATCH; 503
      TRACKING_UNAVAILABLE. The token endpoint uses OAuth2 errors instead, such as
      {"error": "invalid_grant", "error_description": "..."}.
    applies_to: [error]

  transientFailures:
    description: >-
      Two failures are temporary and clear when the request is retried. checkInventory answers 200
      with status ERROR and errorCode STALE_READ for the first read of SKU-1004 with each bearer
      token in each region. getShipment answers 503 TRACKING_UNAVAILABLE with a Retry-After header (seconds) for the
      first two reads of every shipment. Retry those two; every other error fails the same way again.
    applies_to: [sku, shipmentId]
    constraint: wait the Retry-After seconds before retrying getShipment

  cartLifecycle:
    description: >-
      A cart is open from createCart until checkoutCart turns it into an order. addItem, applyCoupon,
      and checkoutCart need an open cart (409 CART_NOT_OPEN afterwards), and checkoutCart needs at
      least one line (409 CART_EMPTY). A cart holds one coupon; applying another replaces it. The
      order's totals are fixed at checkout, so add every item and the coupon first.
    applies_to: [cartId]

  stock:
    description: >-
      addItem checks stock against the cart's total quantity of the SKU, what is already in the cart
      plus the new quantity, and answers 409 OUT_OF_STOCK when that exceeds the stock. Stock never
      decreases, so every run sees the same numbers.
    applies_to: [sku, quantity]
    examples:
      in-stock: [SKU-1001 (42), SKU-1002 (17), SKU-1003 (120), SKU-1004 (9), SKU-1006 (300)]
      out-of-stock: [SKU-1005]

  regionalPricing:
    description: >-
      The region in the base URL (us or eu) sets currency, prices, tax, shipping, and coupons. us:
      USD at list price, 8.25% sales tax added at checkout, shipping standard 599, express 1499,
      overnight 2999. eu: EUR at 0.92 times the US price, 20% VAT already included in prices,
      shipping standard 499 and express 1299, and no overnight tier (422 TIER_NOT_AVAILABLE). At
      checkout the discount is the coupon's percentage of the subtotal, tax is computed on the
      subtotal minus the discount, and the total is subtotal minus discount plus shipping, plus the
      tax in us. FREESHIP makes shipping 0.
    applies_to: [shippingTier, postalCode, code, currency, total]
    constraint: shippingTier overnight is only valid in the us region
    examples:
      us: [standard, express, overnight]
      eu: [standard, express]

  orderLifecycle:
    description: >-
      An order moves created → paid (paymentCharge) → shipped (shipOrder) → delivered
      (deliverShipment) → returned (createReturn). cancelOrder moves a created or paid order to
      cancelled. Any other move answers 409 INVALID_TRANSITION. The payment status moves separately:
      unpaid → captured (paymentCharge) → partially_refunded or refunded (paymentRefund). Cancelling
      or returning an order never refunds it; call paymentRefund, which works in any order state
      while captured money remains.
    applies_to: [orderId, shipmentId, paymentStatus]

  minorUnits:
    description: >-
      Money is an integer in minor units (cents), sent and received as a JSON integer, never a
      decimal or a string. An order's subtotal, discount, shipping, tax, and total each have a
      matching *Display field with the formatted value, such as $130.66 or €87.78; order lines carry
      only unitPrice and lineTotal. A charge must equal the order total exactly.
    applies_to: [amount, total, subtotal, discount, price, shipping, tax]

types:
  sku:
    description: Catalog SKU
    format: string
    validation: "^SKU-[0-9]{4}$"
    pool: skus

  postalCode:
    description: Delivery postal code for the region
    format: string
    pool: postalCodes

  couponCode:
    description: Cart coupon code, matched case-insensitively
    format: string
    validation: "^[A-Za-z0-9-]+$"
    pool: couponCodes

valuePools:
  skus:
    description: The fixed six-SKU catalog
    type: string
    values:
      - SKU-1001  # Trail Backpack (gear, 42 in stock)
      - SKU-1002  # Camp Stove (gear, 17 in stock)
      - SKU-1003  # Merino Tee (apparel, 120 in stock)
      - SKU-1004  # Rain Shell (apparel, 9 in stock; first inventory read per token is stale)
      - SKU-1005  # Trail Runners (footwear; always out of stock)
      - SKU-1006  # Wool Socks (footwear, 300 in stock)

  postalCodes:
    description: Postal codes by region
    type: string
    groups:
      us: ["78701", "94110", "10001"]
      eu: ["10115", "75001", "1017"]

  couponCodes:
    description: Coupons the sandbox knows
    type: string
    values:
      - SAVE10    # 10% off the subtotal, every region
      - FREESHIP  # free shipping, every region
      - EU-ONLY   # 10% off, eu only (422 in us)

  shippingTiers:
    description: Shipping tiers
    type: string
    values:
      - standard
      - express
      - overnight  # us only

  testCards:
    description: Card numbers for paymentCharge
    type: string
    values:
      - "4242424242424242"  # Visa, approved
      - "378282246310005"   # Amex, approved
      - "4000000000000002"  # declined (402 CARD_DECLINED)

  giftCards:
    description: Demo gift cards and their balances
    type: string
    values:
      - GC-10-DEMO   # 1000 minor units, too small for any order (402 INSUFFICIENT_FUNDS)
      - GC-100-DEMO  # 10000 minor units; orders above that total get 402 INSUFFICIENT_FUNDS
      - GC-500-DEMO  # 50000 minor units; covers orders up to that total
