# Two regions of the same local sandbox. `_base` holds everything they share; `us` and
# `eu` only set variables. Pick one with --env (the manifest defaults to us).
shared:
  headers:
    Accept: application/json
  settings:
    oasValidation: warn

environments:
  _base:
    notes: Local aat-sandbox; start it with `aat-sandbox serve` before running plans.
    vars:
      apiHost: "localhost:8765"
      payHost: "localhost:8766"
    apiBaseUrl: http://${apiHost}/${region}/v1
    auth:
      type: oauth2
      tokenUrl: http://${apiHost}/oauth/token
      credentials:
        username: {source: literal, value: demo}
        password: {source: literal, value: demo}
        clientId: {source: literal, value: aat-shop}
        clientSecret: {source: literal, value: aat-shop-secret}
    values:
      postalCode: ${postalCode}
    overrides:
      # Payments run on their own host with their own credential. Only payment*
      # operations go there, and the shop bearer token is not sent along.
      - match: "payment*"
        baseUrl: http://${payHost}/${region}/v1
        auth:
          type: apikey
          headerName: X-API-Key
          credentials:
            key: {source: literal, value: pay-demo-key}

  us:
    extends: _base
    vars:
      region: us
      postalCode: "78701"

  eu:
    extends: _base
    vars:
      region: eu
      postalCode: "10115"
