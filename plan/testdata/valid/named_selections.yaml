metadata:
  created: 2026-02-08T12:00:00Z
  prompt: "Book a flight from DEN to SFO using named selections"
  graphVersion: "1.0.0"

intent:
  goal: commitBooking
  description: "Complete a flight booking using named selections"

execution:
  steps:
    - node: searchFlights
      description: "Search for flights DEN to SFO"
      values:
        origin: "DEN"
        destination: "SFO"
        departureDate: "2026-03-15"

    - node: priceOffer
      dependsOn: [searchFlights]
      description: "Price the first available offering"
      selections:
        offering:
          from: searchFlights.catalogOfferings
          strategy: first
      values:
        catalogOfferingsId:
          from: searchFlights.catalogOfferingsId
        offeringId:
          fromSelection: offering.offeringId
        productRef:
          fromSelection: offering.productRef

    - node: createItinerary

    - node: addOffer
      dependsOn: [searchFlights, createItinerary]
      selections:
        offering:
          from: searchFlights.catalogOfferings
          strategy: first
      values:
        itineraryId:
          from: createItinerary.itineraryId
        catalogOfferingsId:
          from: searchFlights.catalogOfferingsId
        offeringId:
          fromSelection: offering.offeringId
        productRef:
          fromSelection: offering.productRef

    - node: addTraveler
      dependsOn: [createItinerary]
      values:
        itineraryId:
          from: createItinerary.itineraryId
        surname: "Smith"
        givenName: "Jane"
        birthDate: "1990-01-15"
        gender: "Male"

    - node: commitBooking
      dependsOn: [addOffer, addTraveler, createItinerary]
      isGoal: true
      values:
        itineraryId:
          from: createItinerary.itineraryId
        offerStatus:
          from: addOffer.offerStatus
        travelerId:
          from: addTraveler.travelerId
