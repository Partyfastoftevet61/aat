intent:
  description: "Test slot-based workflow"

execution:
  steps:
    - node: createItinerary
      description: "Create itinerary"

    - slot: trip-search

    - node: addTraveler
      dependsOn: [trip-search]
      values:
        itineraryId: {from: createItinerary.itineraryId}

    - slot: payment
      dependsOn: [trip-search]

    - node: finalStep
      dependsOn: [addTraveler, payment]
      isGoal: true
      values:
        itineraryId: {from: createItinerary.itineraryId}
        amount: AUTOWIRE

  cleanup:
    - node: commit
      runOn: always
