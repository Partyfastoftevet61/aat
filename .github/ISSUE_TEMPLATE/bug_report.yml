name: Bug report
description: AAT does something other than what the docs say it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal graph, template, and plan that reproduce the problem are the
        single most useful thing you can include.
  - type: input
    id: version
    attributes:
      label: aat --version
      description: Paste the output of `aat --version`.
      placeholder: aat 0.1.0 (abc1234, 2026-09-01)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 (arm64) / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal graph, template, and plan
      description: >
        The smallest graph/template/plan that reproduces the problem, or a link to a repository or
        gist. Strip credentials and any hostnames you cannot share.
      render: yaml
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command
      placeholder: aat run plan plans/checkout.yaml --env local --json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including any error text.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: --json output or .aar archive
      description: >
        Paste the `--json` summary, or drag and drop the run's `.aar` export here. Archives redact
        auth headers, but request and response bodies are stored as-is — check them first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `aat validate` and it reports no errors for the files involved.
