name: Feature request
description: Propose a new primitive or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AAT exposes composable primitives (graph nodes, templates, plan steps, assertions, overrides,
        MCP tools) and leaves plan authoring to external tools. Requests framed as a primitive — a new
        YAML field, a new step type, a new CLI flag — are the easiest to evaluate. Check `ROADMAP.md`
        for what is already planned and what is out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What are you trying to test or automate, and where does AAT get in the way today? Concrete
        API and workflow details help more than abstractions.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed primitive or YAML shape
      description: >
        Sketch the graph/plan/env YAML, CLI flag, or MCP tool you have in mind. It does not have to
        be final.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other ways to get the same result — with existing AAT features, with a script around AAT, or
        with another tool — and why they fall short.
